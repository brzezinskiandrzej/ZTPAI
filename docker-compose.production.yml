version: "3.8"

services:
  ##################################
  # Backend
  ##################################
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: my-backend:1.0
    container_name: app-backend
    # Lepiej port 5000 wystawiać tylko wewnątrz sieci, np. w produkcji przez reverse proxy
    ports:
      - "3000:3000"
    environment:
      # Podajemy zmienne środowiskowe do połączenia z DB
      DATABASE_URL: "postgres://user:password@db:5432/mydatabase"
      # Inne potrzebne sekrety można wstrzyknąć z zewnątrz np. przez environment
      NODE_ENV: "production"
      ACCESS_TOKEN_SECRET:  "leTK82maWBeXH7hO6lw"
      REFRESH_TOKEN_SECRET: "iEDAw1YbJroBaBt8D9R"
      RABBIT_URL: "amqp://rabbit:5672"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL:  ${OPENAI_MODEL:-gpt-3.5-turbo-1106}

    depends_on:
      - db
      - rabbit
    networks:
      - app-network

  ##################################
  # Frontend (Nginx z gotowym buildem React)
  ##################################
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: my-frontend:1.0
    container_name: app-frontend
    ports:
      - "80:80"        # wystawiamy naszą aplikację
    depends_on:
      - backend
    networks:
      - app-network

  ##################################
  # PostgreSQL
  ##################################
  db:
    image: postgres:15-alpine
    container_name: app-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5432:5432"  
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "user", "-d", "mydatabase" ]
      interval: 3s
      retries: 10
  
  rabbit:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"  
      - "15672:15672" 
    networks:
      - app-network
volumes:
  db-data:

networks:
  app-network:
