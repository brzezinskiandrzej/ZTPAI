version: "3.8"

services:
  ##################################
  # Backend
  ##################################
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: my-backend:1.0
    container_name: app-backend
    # Lepiej port 5000 wystawiać tylko wewnątrz sieci, np. w produkcji przez reverse proxy
    ports:
      - "5000:5000"
    environment:
      # Podajemy zmienne środowiskowe do połączenia z DB
      DATABASE_URL: "postgres://user:password@localhost:5432/mydatabase"
      # Inne potrzebne sekrety można wstrzyknąć z zewnątrz np. przez environment
      NODE_ENV: "production"
    depends_on:
      - db
    networks:
      - app-network

  ##################################
  # Frontend (Nginx z gotowym buildem React)
  ##################################
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: my-frontend:1.0
    container_name: app-frontend
    ports:
      - "80:80"        # wystawiamy naszą aplikację
    depends_on:
      - backend
    networks:
      - app-network

  ##################################
  # PostgreSQL
  ##################################
  db:
    image: postgres:15-alpine
    container_name: app-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5432:5432"  

volumes:
  db-data:

networks:
  app-network:
